{% extends "base_generic.html" %}

{% block content %}

<h1>Delete Book Copy: {{ bookinstance }}</h1>

{% if bookinstance.borrower %}
<p>This copy is currently on loan to <strong>{{ bookinstance.borrower }}</strong>.</p>
{% endif %}

<p>Are you sure you want to delete this copy?</p>

<form action="" method="POST">
    {% csrf_token %}
    <input type="submit" value="Yes, delete.">
</form>

{% endblock %}
